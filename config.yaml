# ─────────────────────────────────────────────────────────────────────────────
# Job tracker settings. Edit freely — every hourly run re-reads this file.
#
# Keyword entries are case-insensitive. A plain word/phrase is matched as a whole
# word ("ml" will not match "html"). Anything containing regex symbols is used as a regex.
# ─────────────────────────────────────────────────────────────────────────────

# A title must match at least one of these categories to be tracked.
title_keywords:
  ML:
    - machine learning
    - ml
    - mle
    - ai
    - a\.i\.
    - artificial intelligence
    - deep learning
    - llm
    - llms
    - genai
    - generative
    - nlp
    - natural language
    - applied scientist
    - research engineer
    - research scientist
    - ml engineer
    - inference
    - model training
    - foundation model
    - reinforcement learning
    # - data scientist        # uncomment to include data science roles
  CV:
    - computer vision
    - vision
    - perception
    - imaging
    - image
    - video understanding
    - 3d
    - slam
    - lidar
    - sensor fusion
    - autonomy
    - autonomous
    - robotics
    - robot
    - self-driving
    - mapping
    - localization
  SDE:
    - software engineer
    - software engineering
    - software developer
    - software development
    - sde
    - swe
    - backend
    - back-end
    - back end
    - full stack
    - full-stack
    - fullstack
    - platform engineer
    - infrastructure engineer
    - distributed systems
    - systems software
    - developer

# The title must ALSO contain one of these role words (filters out "AI Sales Lead", "Data Mapping Analyst"...).
role_words:
  - engineer
  - engineering
  - developer
  - scientist
  - researcher
  - research
  - sde
  - swe
  - mle
  - programmer
  - member of technical staff
  - mts
  - resident
  - residency

# Titles containing any of these are dropped even if they matched above.
title_exclude:
  - sales
  - account executive
  - account manager
  - recruiter
  - recruiting
  - talent
  - marketing
  - counsel
  - attorney
  - legal
  - policy
  - writer
  - designer
  - product manager
  - program manager
  - project manager
  - customer
  - support
  - technician
  - mechanical engineer
  - electrical engineer
  - business development
  - clinical
  - nurse
  - teacher
  - tutor
  - annotator
  - data labeling
  - trainer               # "AI trainer" gig roles
  - contract
  - contractor
  - part-time
  - part time
  - it engineer
  - it support
  - it specialist
  - it analyst
  - help desk
  - helpdesk
  - desktop support
  - advocate
  - evangelist
  - developer relations
  - solutions consultant

level:
  # Seniority words that remove a job.
  exclude:
    - senior
    - sr
    - sr\.
    - staff
    - principal
    - lead
    - manager
    - director
    - head of
    - vp
    - vice president
    - distinguished
    - fellow
    - architect
    - iii
    - iv
    - "\\bl[5-9]\\b"
    - "level [3-9]"
    - "(engineer|developer|scientist|sde|swe)\\s*(iii|iv|[3-9])\\b"
    - intern
    - internship
    - interns
    - co-op
    - coop
    - apprentice
    - postdoc
    - postdoctoral
  # Words that mark a title as explicitly new-grad friendly (gets a ⭐ and sorts first).
  newgrad_markers:
    - new grad
    - new graduate
    - new college grad
    - university grad
    - university graduate
    - college graduate
    - graduate
    - entry level
    - entry-level
    - early career
    - early-career
    - early in career
    - junior
    - associate
    - "engineer i\\b"
    - "engineer 1\\b"
    - "\\bsde i\\b"
    - "\\bsde 1\\b"
    - "level 1"
    - "2027"
    - rotational
    - residency
    - "new grad 20\\d\\d"
  # "Engineer II" / "SDE 2" titles usually want 2–5 years. Dropped unless the title also says new grad / university.
  exclude_level_ii: true
  flag_as_level_ii:
    - ii
    - "\\b2\\b"

# ── When you can start ──
# Jobs are classified from the title + description:
#   fits      – says 2027 start / class of 2027 / graduation window that includes yours  → 📅 badge
#   too_early – says 2025/2026 start, "start immediately", or a graduation window that
#               ends before yours → no notification, hidden on the dashboard by default
#   unknown   – no start date mentioned (most jobs; many hire new grads on a rolling basis) → kept
start_date:
  graduation: 2027-05       # your graduation month
  earliest_start: 2027-06   # first month you can start full-time
  notify_too_early: false   # set true to still get pinged for explicit too-early roles

experience:
  # You're 0–2 years. "N years" mentions offered as an alternative to a degree
  # ("3+ years OR a Master's") are ignored, so MS-friendly roles aren't hidden.
  flag_min_years: 2   # show a ⏳ badge when the description asks for ≥ this many years
  hide_min_years: 3   # hide the job when the description asks for ≥ this many years

locations:
  keep_remote: true    # "Remote" with no country → kept (flagged)
  keep_unknown: true   # couldn't tell the country → kept (flagged)

# ── AI screening — OFF by default ──
# Optional: an LLM reads each job description and rejects roles that aren't for you. LLMs can be wrong,
# so rejected jobs are never deleted: a dashboard toggle shows them with the AI's reason.
# To try it: set enabled: true AND add a free Google Gemini key as the GEMINI_API_KEY repository secret.
ai_filter:
  enabled: false
  base_url: https://generativelanguage.googleapis.com/v1beta/openai   # any OpenAI-compatible API works
  model: gemini-flash-lite-latest
  fallback_models: [gemini-2.5-flash-lite]
  api_key_env: GEMINI_API_KEY
  jobs_per_request: 6             # several jobs graded per request to stretch the free quota
  max_requests_per_run: 40        # 8 runs/day × 40 = 320 requests/day (free Flash-Lite ≈ 500/day)
  requests_per_minute: 10
  hide_rejected: true
  profile: |
    MS in Computer Science at USC, graduating May 2027; can start full-time in June 2027 or later.
    0–2 years of experience (internships only: backend in Go/C#/.NET, AWS data pipelines, ML/computer vision).
    Targets new-grad / entry-level software engineering, backend, ML/AI engineering, and computer vision /
    perception roles anywhere in the United States (open to relocation).
    On F-1 visa: will need H-1B sponsorship later, so citizenship-only or clearance roles are impossible.
    Skills: Python, Go, C++, C#, SQL, TypeScript, PyTorch, OpenCV, Hugging Face, LLMs/RAG, AWS, Docker, PostgreSQL.

notifications:
  # Channels are enabled by adding secrets in GitHub (see README). No secret = channel off.
  seed_notify_hours: 48      # first scan of a new board: only ping jobs posted in the last N hours
  max_jobs_per_run: 60       # safety cap so a bad run can't spam you
  max_post_age_days: 7       # don't ping for jobs whose posting date is older than this (found late)
  include_hidden: false

workday:
  # Workday boards can be huge, so we search instead of listing everything.
  queries:
    - new grad
    - university graduate
    - early career
    - entry level
    - machine learning
    - computer vision
    - software engineer
    - ai engineer
    - perception
    - research engineer
    - robotics
    - backend engineer
  max_results_per_query: 100  # 20 per page

oracle:          # JPMorgan, Goldman (lateral), AmEx, Oracle, BNY… (searched like Workday)
  max_results_per_query: 100
eightfold:       # Microsoft, Qualcomm, Netflix, AmEx
  max_results_per_query: 100

amazon:
  queries:
    - machine learning
    - computer vision
    - applied scientist
    - software development engineer university
    - sde i
    - software development engineer
    - ai engineer
    - perception
    - robotics

# ── Community GitHub lists (cover Google/Meta/Apple/Microsoft/TikTok new-grad roles, etc.) ──
community_lists:
  # Simplify-format JSON files (Simplify + forks)
  json:
    - https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
    - https://raw.githubusercontent.com/vanshb03/New-Grad-2027/dev/.github/scripts/listings.json
  # Markdown-table READMEs (any repo whose README has | Company | Role | Location | ... | tables)
  markdown:
    - https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/NEW_GRAD_USA.md
    - https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/NEW_GRAD_USA.md
    - https://raw.githubusercontent.com/jobright-ai/2026-Software-Engineer-New-Grad/master/README.md
    - https://raw.githubusercontent.com/zapplyjobs/New-Grad-Software-Engineering-Positions/main/README.md
    - https://raw.githubusercontent.com/zapplyjobs/New-Grad-Data-Science-Jobs-2026/main/README.md
  # Used only by weekly discovery to learn more company names (internship posters hire new grads too).
  discovery_only:
    - https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
    - https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/README.md
    - https://raw.githubusercontent.com/speedyapply/2027-SWE-College-Jobs/main/README.md
    - https://raw.githubusercontent.com/jobright-ai/2026-Software-Engineer-Internship/master/README.md
  max_age_days: 120    # ignore community listings older than this

# ── Aggregators with free public APIs ──
aggregators:
  hn: true               # Hacker News "Who is hiring?" (startups; many sponsor)
  themuse: true
  themuse_pages: 10
  remoteok: true
  adzuna: true           # only runs if ADZUNA_APP_ID / ADZUNA_APP_KEY secrets exist (free signup)
  adzuna_queries:
    - machine learning engineer
    - computer vision engineer
    - new grad software engineer
    - entry level software engineer
    - ai engineer
    - university graduate software engineer
    - perception engineer
    - robotics software engineer

# ── Custom career sites without a feed, watched with a headless browser (Playwright) ──
# Put your filters in the URL. link_pattern = regex that matches that site's individual job links.
# Test with:  python -m tracker.sources.pagewatch --test
career_pages:
  - name: Google
    urls:
      - https://www.google.com/about/careers/applications/jobs/results/?location=United%20States&target_level=EARLY&q=%22machine%20learning%22&sort_by=date
      - https://www.google.com/about/careers/applications/jobs/results/?location=United%20States&target_level=EARLY&q=%22software%20engineer%22&sort_by=date
      - https://www.google.com/about/careers/applications/jobs/results/?location=United%20States&target_level=EARLY&q=%22computer%20vision%22&sort_by=date
      - https://www.google.com/about/careers/applications/jobs/results/?location=United%20States&target_level=EARLY&q=%22research%20engineer%22&sort_by=date
    link_pattern: "/jobs/results/\\d+"
  - name: Meta
    urls:
      - https://www.metacareers.com/jobs?q=machine%20learning&offices[0]=North%20America
      - https://www.metacareers.com/jobs?q=university%20grad
      - https://www.metacareers.com/jobs?q=computer%20vision&offices[0]=North%20America
      - https://www.metacareers.com/jobs?q=software%20engineer%20university
    link_pattern: "/(jobs|job_details)/\\d+"
  - name: Apple
    urls:
      - https://jobs.apple.com/en-us/search?location=united-states-USA&key=machine%2520learning&sort=newest
      - https://jobs.apple.com/en-us/search?location=united-states-USA&key=computer%2520vision&sort=newest
      - https://jobs.apple.com/en-us/search?location=united-states-USA&team=internships-STDNT-INTRN&key=graduate&sort=newest
      - https://jobs.apple.com/en-us/search?location=united-states-USA&key=software%2520engineer%2520early%2520career&sort=newest
    link_pattern: "/details/\\d+"
  - name: Microsoft
    urls:
      - https://apply.careers.microsoft.com/careers?query=machine%20learning&location=United%20States&sort_by=timestamp
      - https://apply.careers.microsoft.com/careers?query=software%20engineer%20university&location=United%20States&sort_by=timestamp
      - https://apply.careers.microsoft.com/careers?query=computer%20vision&location=United%20States&sort_by=timestamp
    link_pattern: "/careers/job/\\d+"
  - name: TikTok
    urls:
      - https://lifeattiktok.com/search?keyword=machine%20learning%20graduate&location=CT_157
      - https://lifeattiktok.com/search?keyword=software%20engineer%20graduate&location=CT_157
      - https://lifeattiktok.com/search?keyword=computer%20vision&location=CT_157
    link_pattern: "/search/\\d{10,}"
  - name: Qualcomm
    urls:
      - https://careers.qualcomm.com/careers?query=machine%20learning&location=United%20States&sort_by=timestamp
    link_pattern: "/careers/job/\\d+"
  - name: Netflix
    urls:
      - https://explore.jobs.netflix.net/careers?query=machine%20learning&location=United%20States&sort_by=timestamp
    link_pattern: "/careers/job/\\d+"
  - name: AMD
    urls:
      - https://careers.amd.com/careers-home/jobs?keywords=machine%20learning&location=United%20States&sortBy=posted_date
    link_pattern: "/careers-home/jobs/\\d+"
  - name: Uber
    urls:
      - https://www.uber.com/us/en/careers/list/?query=machine%20learning&location=USA
    link_pattern: "/careers/list/\\d+"
  - name: Goldman Sachs    # campus / analyst roles live on higher.gs.com (lateral roles come via Oracle)
    urls:
      - https://higher.gs.com/results?EXPERIENCE_LEVEL=Analyst&LOCATION=Dallas|New%20York|Jersey%20City|Salt%20Lake%20City|San%20Francisco&page=1&sort=POSTED_DATE
      - https://higher.gs.com/campus?type=students
    link_pattern: "/roles/\\d+"
  - name: ByteDance
    urls:
      - https://jobs.bytedance.com/en/position?keywords=machine%20learning&location=CT_1000,CT_157&project=7322364513776093449
      - https://jobs.bytedance.com/en/position?keywords=graduate&location=CT_1000,CT_157
    link_pattern: "/position/\\d+/detail"
  - name: Tesla            # Tesla often blocks headless browsers; community lists still cover its new-grad roles
    enabled: true
    urls:
      - https://www.tesla.com/careers/search/?query=machine%20learning&site=US
      - https://www.tesla.com/careers/search/?query=autopilot&site=US
    link_pattern: "/careers/search/job/[^/?#]+-\\d+"

