# ─────────────────────────────────────────────────────────────────────────────
# Your company list. Most companies are found automatically (data/companies.json is rebuilt weekly
# from community job lists). Use this file for anything extra.
#
#   - Just a name          → weekly discovery finds its Greenhouse / Ashby / Lever board by name
#   - name + url           → paste ANY job link from their careers site; the platform is auto-detected
#   - name + ats + token   → fully explicit
# Companies with custom career sites (Google, Meta, Apple…) are handled by career_pages in config.yaml.
# ─────────────────────────────────────────────────────────────────────────────
