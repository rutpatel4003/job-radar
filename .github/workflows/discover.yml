name: Discover companies (twice a week)

on:
  schedule:
    - cron: "30 9 * * 0,3"       # Sundays and Wednesdays 09:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-tracker-discover
  cancel-in-progress: false

jobs:
  discover:
    env:
      PYTHONUNBUFFERED: "1"
    runs-on: ubuntu-24.04   # pinned: Playwright's system deps target 24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests PyYAML
      - run: python -m tracker.discover
      - name: Save
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "companies: weekly discovery $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep 7; done
          exit 1
